name: PR Checks

on:
  pull_request:

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/directory-portal

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/directory-portal

      - name: Test
        run: npm test
        env:
          CI: true
          VITE_DIRECTORY_API: http://localhost:3010/api
          API_BASE_URL: http://localhost:3010/api
          VITE_ENABLE_NM: true
          VITE_ENABLE_OM: true
          VITE_ENABLE_IM: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/directory-portal/playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build
