[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pact-api-client"
version = "1.0.0"
description = "Python SDK (data model + HTTP client) for the PACT Data Exchange Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "WBCSD PACT", email = "pact@wbcsd.org" }]
keywords = ["pact", "pcf", "product-carbon-footprint", "wbcsd", "api-client"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.5,<3", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/wbcsd/pact-directory-service#readme"
Repository = "https://github.com/wbcsd/pact-directory-service"
Issues = "https://github.com/wbcsd/pact-directory-service/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "datamodel-code-generator>=0.25,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/pact_api_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
